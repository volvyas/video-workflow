[project]
name = "shorts"
version = "0.1.0"
description = "Automated YouTube Shorts pipeline: topic -> ideas -> script -> voice -> visuals -> captions -> video"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# LLM providers
claude = [
    "anthropic>=0.70",
]
# TTS providers (heavy: pulls torch). Install on the GPU machine.
f5 = ["f5-tts>=1.1", "torch", "torchaudio"]
kokoro = ["kokoro>=0.9.4", "soundfile", "torch"]
# Caption alignment
whisper = ["faster-whisper>=1.0"]
# Bundled ffmpeg binary if system ffmpeg is not installed
ffmpeg = [
    "imageio-ffmpeg>=0.5",
]
# YouTube upload
search = ["ddgs>=9.0"]
youtube = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]

[project.scripts]
shorts = "shorts.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

# RTX 50xx (Blackwell) needs CUDA 12.8+ torch builds.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
